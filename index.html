<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BU KRA Strategy — 100+ to 200+ Engineering Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F5F7F4;
  --bg-deep:#EEF2ED;
  --panel:#FFFFFF;
  --panel-tint:#F1F5F1;
  --ink:#132420;
  --ink-soft:#4C5C56;
  --ink-faint:#8A968F;
  --line:#DAE2D8;
  --line-soft:#E7ECE5;
  --accent:#1E7A5C;
  --accent-ink:#0F4A38;
  --accent-soft:#E1F0E6;
  --accent-2:#AD7A2A;
  --accent-2-soft:#F4E9D3;
  --red:#B14834;
  --red-soft:#F6E4DF;
  --amber:#B4841F;
  --amber-soft:#F5EBD4;
  --green:#2E7D53;
  --green-soft:#E1F0E6;
  --shadow: 0 1px 2px rgba(19,36,32,.04), 0 8px 24px -12px rgba(19,36,32,.14);
  --radius: 14px;
  --font-display:'Fraunces', serif;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0F1613;
    --bg-deep:#0A100D;
    --panel:#16201C;
    --panel-tint:#1A2521;
    --ink:#EDF3EF;
    --ink-soft:#B4C2BB;
    --ink-faint:#77857F;
    --line:#28352F;
    --line-soft:#212C27;
    --accent:#5FBE96;
    --accent-ink:#8ED6B6;
    --accent-soft:#17332A;
    --accent-2:#D8B368;
    --accent-2-soft:#332811;
    --red:#E08A73;
    --red-soft:#3A2019;
    --amber:#E0B85C;
    --amber-soft:#332911;
    --green:#6FCB9C;
    --green-soft:#173327;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --bg-deep:#0A100D; --panel:#16201C; --panel-tint:#1A2521;
  --ink:#EDF3EF; --ink-soft:#B4C2BB; --ink-faint:#77857F;
  --line:#28352F; --line-soft:#212C27;
  --accent:#5FBE96; --accent-ink:#8ED6B6; --accent-soft:#17332A;
  --accent-2:#D8B368; --accent-2-soft:#332811;
  --red:#E08A73; --red-soft:#3A2019; --amber:#E0B85C; --amber-soft:#332911;
  --green:#6FCB9C; --green-soft:#173327;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
::selection{background:var(--accent); color:#fff;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; font-weight:600; letter-spacing:-.01em;}
p{margin:0;}
ul{margin:0; padding:0; list-style:none;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

/* ============ APP SHELL ============ */
#app{
  position:relative;
  height:100dvh;
  width:100vw;
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:
    radial-gradient(1100px 620px at 88% -8%, var(--accent-soft) 0%, transparent 60%),
    radial-gradient(900px 520px at -10% 108%, var(--accent-2-soft) 0%, transparent 55%),
    var(--bg);
}

/* top chrome */
.topbar{
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0;
  height:52px; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(16px,3vw,36px);
  pointer-events:none;
}
.topbar > *{pointer-events:auto;}
.brandmark{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:.05em;
  color:var(--ink-faint);
}
.brandmark .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:36px; height:36px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line);
  color:var(--ink-soft); box-shadow:var(--shadow);
  transition:transform .15s ease, color .15s ease, border-color .15s ease;
}
.icon-btn:hover{color:var(--accent-ink); border-color:var(--accent);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:17px;height:17px;}

/* progress + counter */
.progress-track{
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; height:3px; z-index:41;
  background:var(--line-soft);
}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s cubic-bezier(.65,0,.35,1);}

/* bottom chrome */
.bottombar{
  position:fixed; bottom:env(safe-area-inset-bottom,0px); left:0; right:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(16px,3vw,36px); height:56px;
  pointer-events:none;
}
.bottombar > *{pointer-events:auto;}
.nav-cluster{display:flex; align-items:center; gap:10px;}
.nav-arrow{
  width:40px; height:40px; border-radius:50%;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; color:var(--ink);
  transition:transform .15s ease, background .15s ease, opacity .2s;
}
.nav-arrow svg{width:18px;height:18px;}
.nav-arrow:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
.nav-arrow:active{transform:scale(.92);}
.nav-arrow[disabled]{opacity:.3; pointer-events:none;}
.counter{
  font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint);
  min-width:64px; text-align:center; letter-spacing:.03em;
}
.section-pill{
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:.04em;
  color:var(--ink-soft); background:var(--panel); border:1px solid var(--line);
  padding:7px 14px; border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:8px;
}
.section-pill b{color:var(--accent-ink); font-weight:600;}

/* ============ DECK / SLIDES ============ */
.deck{position:absolute; inset:0;}
.slide{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding: clamp(64px,10vh,84px) clamp(24px,5.5vw,80px) clamp(58px,9vh,74px);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translateX(26px) scale(.99);
  transition:opacity .45s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1), visibility 0s linear .45s;
}
.slide.active{
  opacity:1; visibility:visible; pointer-events:auto; transform:translateX(0) scale(1);
  transition:opacity .45s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1);
}
.slide.exit-left{transform:translateX(-26px) scale(.99);}

.slide-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:20px;
  margin-bottom:clamp(14px,2.4vh,26px);
  flex:0 0 auto;
}
.slide-head .htitle{display:flex; flex-direction:column; gap:6px; min-width:0;}
.tag{
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:.05em;
  color:var(--accent-ink); display:flex; align-items:center; gap:8px;
}
.tag::before{content:''; width:16px; height:2px; background:var(--accent); display:inline-block;}
.slide-head h2{font-size:clamp(1.28rem,2.55vw,2.15rem); line-height:1.08; color:var(--ink);}
.slide-head .sub{font-size:clamp(.78rem,1.05vw,.95rem); color:var(--ink-soft); max-width:60ch; font-weight:400;}
.kicker-num{
  font-family:var(--font-mono); font-size:clamp(2rem,5vw,3.6rem); font-weight:600;
  color:var(--line); line-height:1; flex:0 0 auto; user-select:none;
}

.slide-body{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; justify-content:center;}
.slide-body.scrollsafe{overflow-y:auto; overflow-x:auto;}
.slide-body.scrollsafe table{min-width:640px;}

/* ============ REUSABLE COMPONENTS ============ */
.grid{display:grid; gap:clamp(10px,1.6vh,18px);}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:clamp(12px,1.8vh,20px) clamp(14px,1.6vw,22px);
  display:flex; flex-direction:column; gap:8px; min-height:0;
}
.card h4{font-size:clamp(.86rem,1.05vw,1.02rem); color:var(--ink); font-weight:600; font-family:var(--font-body);}
.card .desc{font-size:clamp(.72rem,.92vw,.86rem); color:var(--ink-soft); line-height:1.42;}
.card .foot{margin-top:auto; font-family:var(--font-mono); font-size:.68rem; color:var(--accent-ink);}

.pillar-chip{
  width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:.66rem; font-weight:600; color:#fff; flex:0 0 auto;
}
.pillar-chip.d{background:var(--accent);}
.pillar-chip.b{background:var(--accent-2);}
.pillar-chip.h{background:#5B7FA3;}

.flow{display:flex; align-items:stretch; gap:0; flex-wrap:wrap; row-gap:14px;}
.flow-step{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:10px 16px; font-size:clamp(.72rem,.95vw,.88rem); font-weight:600; color:var(--ink);
  box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.flow-step .n{font-family:var(--font-mono); font-size:.65rem; color:var(--accent-ink); font-weight:600;}
.flow-arrow{display:flex; align-items:center; padding:0 8px; color:var(--ink-faint); flex:0 0 auto;}
.flow-arrow svg{width:16px;height:16px;}

table{border-collapse:collapse; width:100%;}
.tbl{font-size:clamp(.68rem,.85vw,.82rem);}
.tbl th{
  text-align:left; font-family:var(--font-mono); font-weight:500; font-size:.66em;
  letter-spacing:.03em; color:var(--ink-faint); padding:6px 10px; border-bottom:1px solid var(--line);
}
.tbl td{padding:7px 10px; border-bottom:1px solid var(--line-soft); color:var(--ink-soft); line-height:1.35; vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl td.strong, .tbl th.rowh{color:var(--ink); font-weight:600;}
.tbl tr:hover td{background:var(--panel-tint);}

.badge{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono);
  font-size:.64rem; padding:3px 9px; border-radius:999px; font-weight:600; letter-spacing:.02em;
}
.badge.green{background:var(--green-soft); color:var(--green);}
.badge.amber{background:var(--amber-soft); color:var(--amber);}
.badge.red{background:var(--red-soft); color:var(--red);}
.badge.neutral{background:var(--accent-soft); color:var(--accent-ink);}

.stat{
  font-family:var(--font-mono); font-weight:600; color:var(--accent-ink);
  font-size:clamp(1.1rem,1.8vw,1.6rem); line-height:1;
}
.stat-label{font-size:.68rem; color:var(--ink-faint); margin-top:4px;}

.divider-line{height:1px; background:var(--line); border:none; margin:0;}

.list-check{display:flex; flex-direction:column; gap:6px;}
.list-check li{
  display:flex; align-items:flex-start; gap:8px; font-size:clamp(.72rem,.92vw,.86rem); color:var(--ink-soft); line-height:1.4;
}
.list-check li svg{flex:0 0 auto; width:14px; height:14px; margin-top:3px; color:var(--accent);}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:clamp(16px,3vw,40px); align-content:center;}
.three-col{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,2vw,22px); align-content:center;}
.four-col{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(10px,1.6vw,18px); align-content:center;}
.agenda-grid{align-content:center;}

.section-label-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.section-label-row .l{font-family:var(--font-mono); font-size:.68rem; color:var(--accent-ink); font-weight:600;}
.section-label-row hr{flex:1; height:1px; background:var(--line); border:none;}

.dot-rating{display:flex; gap:3px;}
.dot-rating span{width:7px; height:7px; border-radius:50%; background:var(--line);}
.dot-rating span.on{background:var(--accent);}

.quote-mark{font-family:var(--font-display); font-size:clamp(2.2rem,5vw,4rem); color:var(--accent-soft); line-height:.6; font-weight:600;}

/* cover */
.cover{justify-content:center; padding-top:clamp(70px,11vh,90px)!important;}
.cover-inner{max-width:1100px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:clamp(18px,3vh,34px);}
.cover-eyebrow{
  display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:.76rem;
  letter-spacing:.05em; color:var(--ink-soft);
}
.cover-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.cover h1{
  font-size:clamp(2.2rem,6.4vw,4.6rem); line-height:1.03; color:var(--ink); font-weight:600;
  letter-spacing:-.015em;
}
.cover h1 em{font-style:italic; color:var(--accent-ink);}
.growth-line{
  display:flex; align-items:baseline; gap:18px; font-family:var(--font-mono);
  font-size:clamp(1.6rem,4vw,2.8rem); color:var(--ink); font-weight:600; margin-top:4px;
}
.growth-line .arrow-big{color:var(--accent); font-size:.8em;}
.growth-line small{font-family:var(--font-body); font-size:.34em; color:var(--ink-soft); font-weight:400;}
.cover-tags{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.cover-tags span{
  font-family:var(--font-mono); font-size:.72rem; padding:7px 14px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line); color:var(--ink-soft); box-shadow:var(--shadow);
}
.cover-foot{display:flex; align-items:center; justify-content:space-between; margin-top:clamp(20px,4vh,44px); flex-wrap:wrap; gap:14px;}
.cover-pillars{display:flex; gap:22px;}
.cover-pillars .p{display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--ink-soft); font-weight:500;}
.start-btn{
  display:flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); border:none;
  padding:12px 20px; border-radius:999px; font-size:.84rem; font-weight:600; box-shadow:var(--shadow);
  transition:transform .15s ease, background .15s ease;
}
.start-btn:hover{transform:translateY(-2px); background:var(--accent-ink);}
.start-btn svg{width:15px;height:15px;}

/* agenda */
.agenda-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,1.6vw,16px); flex:1;}
.agenda-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:clamp(12px,1.8vh,18px) clamp(14px,1.6vw,20px); display:flex; flex-direction:column; gap:6px;
  cursor:pointer; transition:transform .15s ease, border-color .15s ease;
  text-align:left;
}
.agenda-card:hover{transform:translateY(-3px); border-color:var(--accent);}
.agenda-card .idx{font-family:var(--font-mono); font-size:.68rem; color:var(--accent-ink); font-weight:600;}
.agenda-card h4{font-size:clamp(.86rem,1.1vw,1.05rem); color:var(--ink); font-family:var(--font-display); font-weight:600;}
.agenda-card p{font-size:clamp(.68rem,.85vw,.78rem); color:var(--ink-soft); line-height:1.4;}

/* section menu overlay */
.menu-overlay{
  position:fixed; inset:0; z-index:60; background:rgba(15,22,19,.55); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease;
  padding:24px;
}
.menu-overlay.open{opacity:1; pointer-events:auto;}
.menu-panel{
  background:var(--panel); border-radius:20px; max-width:920px; width:100%; max-height:82vh; overflow-y:auto;
  padding:clamp(20px,3vw,34px); box-shadow:0 30px 60px -20px rgba(0,0,0,.35); border:1px solid var(--line);
}
.menu-panel h3{font-size:1.3rem; margin-bottom:4px;}
.menu-panel .sub{color:var(--ink-soft); font-size:.82rem; margin-bottom:18px;}
.menu-list{display:grid; grid-template-columns:repeat(2,1fr); gap:6px 22px;}
.menu-item{
  display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:10px;
  font-size:.84rem; color:var(--ink-soft); transition:background .15s ease, color .15s ease;
  appearance:none; -webkit-appearance:none; background:none; border:none; width:100%; text-align:left; font-family:inherit;
}
.menu-item:hover{background:var(--accent-soft); color:var(--accent-ink);}
.menu-item .num{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-faint); width:24px; flex:0 0 auto;}
.menu-item.head{
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:.04em; color:var(--accent-ink); font-weight:600;
  margin-top:10px; grid-column:1/-1; background:none; padding:4px 10px;
}
.menu-close{position:absolute; top:18px; right:18px;}

/* divider slides */
.divider{align-items:flex-start; justify-content:center;}
.divider-inner{max-width:900px; margin:auto 0;}
.divider .num{font-family:var(--font-mono); font-size:clamp(3rem,9vw,7rem); color:var(--accent-soft); font-weight:600; line-height:.8;}
.divider h2{font-size:clamp(2rem,5.4vw,3.6rem); margin-top:10px;}
.divider p{font-size:clamp(.85rem,1.2vw,1.05rem); color:var(--ink-soft); margin-top:14px; max-width:60ch; line-height:1.5;}

/* footer helper text on slide (optional annotation) */
.note-strip{
  margin-top:auto; padding-top:10px; border-top:1px solid var(--line-soft);
  font-size:clamp(.68rem,.85vw,.78rem); color:var(--ink-faint); display:flex; gap:10px; align-items:flex-start;
}

/* responsive narrow */
@media (max-width: 860px){
  .two-col, .three-col, .four-col, .agenda-grid{grid-template-columns:1fr !important;}
  .menu-list{grid-template-columns:1fr;}
  .slide-body{overflow-y:auto;}
  .cover-foot{flex-direction:column; align-items:flex-start;}
}
@media (max-height: 560px){
  .slide{padding-top:56px; padding-bottom:50px;}
}
.hint-key{
  font-family:var(--font-mono); font-size:.6rem; background:var(--panel-tint); border:1px solid var(--line);
  padding:1px 6px; border-radius:4px; color:var(--ink-soft);
}
</style>
</head>
<body>

<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="topbar">
    <div class="brandmark"><span class="dot"></span> BU KRA STRATEGY <span style="color:var(--ink-faint)">/ 100→200 GROWTH VISION</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="menuBtn" title="Section navigator (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      </button>
      <button class="icon-btn" id="fsBtn" title="Full screen (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>

  <div class="deck" id="deck"><!-- SLIDES INJECTED BELOW --></div>

  <div class="bottombar">
    <div class="section-pill" id="sectionPill">Cover</div>
    <div class="nav-cluster">
      <button class="nav-arrow" id="prevBtn" title="Previous (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="counter" id="counter">01 / 01</div>
      <button class="nav-arrow" id="nextBtn" title="Next (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <div class="menu-overlay" id="menuOverlay">

<script>
(function(){
  "use strict";

  /* ---- Move template contents into the deck ---- */
  var tpl = document.getElementById('slides-template');
  var deck = document.getElementById('deck');
  deck.appendChild(tpl.content.cloneNode(true));
  tpl.remove();

  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var total = slides.length;
  var current = 0;

  var progressFill = document.getElementById('progressFill');
  var counter = document.getElementById('counter');
  var sectionPill = document.getElementById('sectionPill');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var fsBtn = document.getElementById('fsBtn');
  var menuBtn = document.getElementById('menuBtn');
  var menuCloseBtn = document.getElementById('menuCloseBtn');
  var menuOverlay = document.getElementById('menuOverlay');
  var menuList = document.getElementById('menuList');

  function pad(n){ return (n<10?'0':'')+n; }

  function render(){
    slides.forEach(function(s,i){
      s.classList.toggle('active', i===current);
    });
    var pct = total>1 ? (current/(total-1))*100 : 100;
    progressFill.style.width = pct+'%';
    counter.textContent = pad(current+1)+' / '+pad(total);
    sectionPill.textContent = slides[current].getAttribute('data-section') || '';
    prevBtn.disabled = current===0;
    nextBtn.disabled = current===total-1;
    highlightMenu();
  }

  function go(i){
    if(i<0) i=0;
    if(i>total-1) i=total-1;
    if(i===current) return;
    current = i;
    render();
  }
  function next(){ go(current+1); }
  function prev(){ go(current-1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  /* ---- jump targets ---- */
  document.addEventListener('click', function(e){
    var jumpEl = e.target.closest('[data-jump]');
    if(jumpEl){
      var id = jumpEl.getAttribute('data-jump');
      var idx = slides.findIndex(function(s){ return s.id===id; });
      if(idx>=0){ go(idx); }
      return;
    }
    var startBtn = e.target.closest('#startBtn');
    if(startBtn){ go(1); return; }
    var restartBtn = e.target.closest('#restartBtn');
    if(restartBtn){ go(0); return; }
  });

  /* ---- keyboard ---- */
  document.addEventListener('keydown', function(e){
    if(menuOverlay.classList.contains('open')){
      if(e.key==='Escape') closeMenu();
      return;
    }
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); go(0); }
    else if(e.key==='End'){ e.preventDefault(); go(total-1); }
    else if(e.key.toLowerCase()==='f'){ toggleFullscreen(); }
    else if(e.key.toLowerCase()==='m'){ openMenu(); }
  });

  /* ---- swipe ---- */
  var touchX = null;
  deck.addEventListener('touchstart', function(e){ touchX = e.changedTouches[0].clientX; }, {passive:true});
  deck.addEventListener('touchend', function(e){
    if(touchX===null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ dx<0 ? next() : prev(); }
    touchX = null;
  }, {passive:true});

  /* ---- fullscreen ---- */
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  }
  fsBtn.addEventListener('click', toggleFullscreen);

  /* ---- section menu ---- */
  function buildMenu(){
    var lastSection = null;
    var html = '';
    slides.forEach(function(s,i){
      var section = s.getAttribute('data-section') || '';
      var title = s.getAttribute('data-title') || section;
      if(section !== lastSection){
        html += '<div class="menu-item head">'+section+'</div>';
        lastSection = section;
      }
      html += '<button class="menu-item" data-goto="'+i+'"><span class="num">'+pad(i+1)+'</span>'+title+'</button>';
    });
    menuList.innerHTML = html;
  }
  function highlightMenu(){
    var items = menuList.querySelectorAll('.menu-item[data-goto]');
    items.forEach(function(it){
      it.style.background = (parseInt(it.getAttribute('data-goto'),10)===current) ? 'var(--accent-soft)' : '';
      it.style.color = (parseInt(it.getAttribute('data-goto'),10)===current) ? 'var(--accent-ink)' : '';
    });
  }
  menuList.addEventListener('click', function(e){
    var btn = e.target.closest('[data-goto]');
    if(btn){ go(parseInt(btn.getAttribute('data-goto'),10)); closeMenu(); }
  });
  function openMenu(){ menuOverlay.classList.add('open'); }
  function closeMenu(){ menuOverlay.classList.remove('open'); }
  menuBtn.addEventListener('click', openMenu);
  menuCloseBtn.addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', function(e){ if(e.target===menuOverlay) closeMenu(); });

  /* ---- scorecard table (built from data, avoids markup repetition) ---- */
  var scorecard = [
    ['Revenue Growth',1,3,1],
    ['Gross Margin / P&L',2,3,1],
    ['Client Retention',3,3,1],
    ['Client Satisfaction',3,2,1],
    ['Account Expansion',2,3,1],
    ['Pipeline',1,3,0],
    ['Utilization',3,2,1],
    ['Attrition',2,1,3],
    ['Hiring',1,2,3],
    ['Bench',2,2,3],
    ['Upskilling',3,1,3],
    ['Innovation',3,2,1],
    ['Career Growth',3,1,3]
  ];
  function dots(n){
    var out = '<span class="dot-rating">';
    for(var i=0;i<3;i++){ out += '<span class="'+(i<n?'on':'')+'"></span>'; }
    return out+'</span>';
  }
  var tbody = document.querySelector('#scorecardTable tbody');
  if(tbody){
    tbody.innerHTML = scorecard.map(function(row){
      return '<tr><td class="strong">'+row[0]+'</td>'+
        '<td style="text-align:center">'+dots(row[1])+'</td>'+
        '<td style="text-align:center">'+dots(row[2])+'</td>'+
        '<td style="text-align:center">'+dots(row[3])+'</td></tr>';
    }).join('');
  }

  buildMenu();
  render();
})();
</script>
</body>
</html>
